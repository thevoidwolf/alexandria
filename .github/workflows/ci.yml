name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.3.2
        with:
          # The oldest Python pyproject.toml allows.
          python-version: "3.12"
          enable-cache: true

      - name: Install
        run: uv sync --locked --group eval

      - name: Lint
        run: uv run ruff check

      # Search, classifier and anchor tests embed with the real default model.
      - name: Cache the embedding model
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-bge-small-en-v1.5

      - name: Test
        run: uv run --group eval pytest
