<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ title }}{% endblock %}</title>
  <style>
    :root {
      --bg: #faf8f4;
      --panel: #ffffff;
      --ink: #1a1614;
      --dim: #6b6560;
      --line: #e3ddd3;
      --accent: #a35a20;
      --accent-soft: #f4ead9;
      --ok: #2f7a3a;
      --warn: #b26200;
      --err: #a02a1e;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--ink);
      font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code, pre, .mono {
      font-family: "SF Mono", ui-monospace, "JetBrains Mono", Menlo, Consolas, monospace;
      font-size: 12.5px;
    }
    header.site {
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    header.site .inner {
      max-width: 1100px; margin: 0 auto; padding: 14px 24px;
      display: flex; align-items: baseline; gap: 20px;
    }
    header.site h1 {
      margin: 0;
      font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      font-weight: 500;
      font-size: 22px;
      letter-spacing: 0.01em;
    }
    header.site nav { margin-left: auto; display: flex; gap: 16px; }
    header.site nav a { color: var(--dim); font-size: 13px; }
    header.site nav a:hover { color: var(--ink); text-decoration: none; }
    header.site nav a.here { color: var(--ink); border-bottom: 1.5px solid var(--accent); }
    mark { background: var(--accent-soft); color: var(--ink); padding: 0 2px; border-radius: 2px; }
    header.site nav form { display: inline; margin: 0; }
    header.site nav button.linklike {
      background: none; border: 0; padding: 0; cursor: pointer;
      color: var(--dim); font: inherit; font-size: 13px;
    }
    header.site nav button.linklike:hover { color: var(--ink); }
    main { max-width: 1100px; margin: 0 auto; padding: 28px 24px 64px; }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 20px;
    }
    .card + .card { margin-top: 20px; }
    h2 {
      font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      font-weight: 500;
      font-size: 18px;
      margin: 0 0 12px;
      letter-spacing: 0.01em;
    }
    .dim { color: var(--dim); }
    .row { display: flex; gap: 24px; flex-wrap: wrap; }
    .row > * { flex: 1 1 240px; }
    .stat {
      border-left: 3px solid var(--line);
      padding: 4px 0 4px 12px;
    }
    .stat .k { font-size: 12px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.06em; }
    .stat .v {
      font-family: "Iowan Old Style", "Palatino Linotype", Georgia, serif;
      font-size: 24px;
      font-weight: 500;
    }
    .chip {
      display: inline-block;
      padding: 2px 8px; margin: 2px 4px 2px 0;
      border-radius: 999px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
    }
    .chip .n { color: var(--dim); margin-left: 6px; }
    table.jobs { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.jobs th, table.jobs td {
      text-align: left; padding: 8px 10px;
      border-bottom: 1px solid var(--line);
    }
    table.jobs th {
      font-weight: 500; color: var(--dim);
      text-transform: uppercase; letter-spacing: 0.05em; font-size: 11px;
    }
    table.jobs td.status { font-size: 12px; }
    td.status span.pill, span.status-pill {
      display: inline-block;
      padding: 2px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 500;
      text-transform: lowercase;
      letter-spacing: 0.02em;
    }
    .status-queued    span.pill { background: #eee7d9; color: var(--dim); }
    .status-running   span.pill { background: #fdecc8; color: var(--warn); animation: pulse 1.2s ease-in-out infinite; }
    .status-done      span.pill { background: #dcecd7; color: var(--ok); }
    .status-error     span.pill { background: #f7d9d5; color: var(--err); }
    .status-cancelled span.pill { background: #e8e4de; color: var(--dim); text-decoration: line-through; }
    @keyframes pulse { 50% { opacity: 0.55; } }
    .empty { color: var(--dim); font-style: italic; padding: 12px 0; }
    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    .banner {
      padding: 10px 14px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 12px;
    }
    .banner-error { background: #fde8e6; color: var(--err); }
    .banner-ok    { background: #e6f2e2; color: var(--ok); }
    button, input[type=submit] {
      background: var(--ink); color: var(--bg);
      border: 0; border-radius: 4px; padding: 10px 18px;
      font: inherit; font-size: 14px; cursor: pointer;
    }
    button:hover, input[type=submit]:hover { background: var(--accent); }
    input[type=password], input[type=text] {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 10px 12px;
      font: inherit; font-size: 15px;
      width: 100%;
    }
    input:focus { outline: 2px solid var(--accent-soft); outline-offset: 1px; border-color: var(--accent); }
    footer.site {
      max-width: 1100px; margin: 0 auto; padding: 20px 24px;
      color: var(--dim); font-size: 12px;
    }
    footer.site .mono { color: var(--dim); }

    @media (max-width: 640px) {
      header.site .inner { flex-wrap: wrap; padding: 12px 14px; gap: 10px; }
      header.site h1 { font-size: 19px; }
      header.site nav { margin-left: 0; width: 100%; justify-content: flex-start; gap: 12px; }
      main { padding: 16px 12px 48px; }
      .card { padding: 14px; }
      .card + .card { margin-top: 12px; }
      h2 { font-size: 16px; }
      .row { gap: 12px; }
      .row > * { flex-basis: 45%; }
      .stat .v { font-size: 20px; }
      table.jobs { font-size: 12px; }
      table.jobs th, table.jobs td { padding: 6px 6px; }
      #drop { padding: 26px 12px !important; }
      footer.site { padding: 14px; }
    }
  </style>
</head>
<body>
  {% block header %}
  <header class="site">
    <div class="inner">
      <h1><a href="/" style="color: inherit;">{{ title }}</a></h1>
      {% if authenticated %}
      <nav>
        <a href="/"{% if nav == 'home' %} class="here"{% endif %}>home</a>
        <a href="/search"{% if nav == 'search' %} class="here"{% endif %}>search</a>
        <a href="/documents"{% if nav == 'documents' %} class="here"{% endif %}>documents</a>
        <a href="/taxonomy"{% if nav == 'taxonomy' %} class="here"{% endif %}>taxonomy</a>
        <a href="/anchors"{% if nav == 'anchors' %} class="here"{% endif %}>anchors</a>
        <a href="/suggest-metadata"{% if nav == 'suggest' %} class="here"{% endif %}>suggest</a>
        <form method="post" action="/logout">
          <button type="submit" class="linklike">log out</button>
        </form>
      </nav>
      {% endif %}
    </div>
  </header>
  {% endblock %}

  <main>
    {% block main %}{% endblock %}
  </main>

  {% block footer %}
  <footer class="site">
    <span class="mono">v{{ version }}</span> · {{ home }}
  </footer>
  {% endblock %}
</body>
</html>
