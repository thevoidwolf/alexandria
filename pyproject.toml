[project]
name = "alexandria"
version = "0.1.0"
description = "Local knowledge store with an MCP interface"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "voidwolf" }]

dependencies = [
    # Storage
    "sqlite-vec>=0.1.6",
    # Extraction
    "pypdf>=5.1",
    "pdfplumber>=0.11",
    "trafilatura>=2.0",
    # Embeddings
    "sentence-transformers>=3.3",
    # Ingest support
    "python-ulid>=3.0",
    "filetype>=1.2",
    # CLI
    "typer>=0.15",
    "rich>=13.9",
    # HTTP
    "httpx>=0.28",
    # MCP server
    "mcp>=1.2",
]

[project.optional-dependencies]
# High-fidelity PDF extractor for scientific/math papers. Requires ~2GB of model
# weights (auto-downloaded to ~/.cache/datalab/) and a GPU for practical latency.
# Enable with:  uv sync --extra marker
marker = ["marker-pdf>=1.10,<2"]

[project.scripts]
alexandria = "alexandria.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/alexandria"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]
